# Public checks only. The private term list is NOT available here (and must never be): this job passing does not
# mean the private personal-data check passed — that is scripts/preflight.sh, run before every push.
name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.13'}
      - run: pip install -r requirements-ci.txt
      - name: Agent Skills spec (skills-ref)
        run: |
          n=0
          for d in skills/*/*/; do agentskills validate "$d"; n=$((n+1)); done
          test "$n" -gt 0 || { echo "no skills found"; exit 1; }
      - name: repository rules (scripts/validate.py)
        run: python scripts/validate.py
      - name: tests (validator negatives, projector probes)
        run: python -m unittest discover -s tests -v
      - name: projection probe (assistant = exactly the listed skills)
        run: |
          mkdir -p "$RUNNER_TEMP/root"
          python scripts/project.py release --repo . --ref HEAD --groups assistant,dev --root "$RUNNER_TEMP/root"
          python - "$RUNNER_TEMP/root" <<'PY'
          import json, os, sys
          mp = json.load(open('.claude-plugin/marketplace.json'))
          want = sorted(p.rsplit('/', 1)[1] for pl in mp['plugins'] for p in pl['skills'])
          got = sorted(os.listdir(os.path.join(sys.argv[1], 'current', 'view')))
          assert got == want, (got, want)
          print(len(got), 'skills projected')
          PY
      - name: private check
        run: echo "::notice::private personal-data term check does not run in CI (not a pass); see scripts/preflight.sh"
